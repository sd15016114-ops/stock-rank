<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script>/* 先套用上次選的日間／夜間版，避免畫面閃一下 */
try{ var t = localStorage.getItem('stock-rank-theme'); if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme', t); }catch(e){}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>股市動能排行｜台股、美股盤後成交值排行</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{
  /* 日間：白底、寶寶藍。--fill 是按鈕底色，--accent 是白底上的藍色文字（比寶寶藍深一點才看得清楚） */
  --paper:#FFFFFF; --sheet:#FFFFFF; --tint:#F2F9FE; --ink:#16242F; --muted:#5F7180;
  --rule:#D5E6F3; --fill:#89CFF0; --on-fill:#0C3350; --accent:#1F7FBF; --soft:#E3F3FC; --seal:#D23B3B;
  --up:#D23B3B; --down:#16885A;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","PMingLiU","Songti TC",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* 夜間：黑底、淡橘。沒按過切換鈕時跟著裝置的深色模式 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#000000; --sheet:#0E0E0E; --tint:#161616; --ink:#F2EDE8; --muted:#A39A91;
    --rule:#2B2620; --fill:#FFC48A; --on-fill:#2B1600; --accent:#FFC48A; --soft:#2E2013; --seal:#FF8A75;
    --up:#FF8A75; --down:#62D6A0;
  }
}
:root[data-theme="dark"]{
    --paper:#000000; --sheet:#0E0E0E; --tint:#161616; --ink:#F2EDE8; --muted:#A39A91;
    --rule:#2B2620; --fill:#FFC48A; --on-fill:#2B1600; --accent:#FFC48A; --soft:#2E2013; --seal:#FF8A75;
    --up:#FF8A75; --down:#62D6A0;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 0 0}
.brand{font-family:var(--serif);font-weight:900;font-size:22px;color:var(--accent)}
/* 日夜切換：圓角滑軌，圓鈕左右滑動（左邊日間、右邊夜間） */
.theme{position:relative;flex:none;width:68px;height:34px;padding:0;border:0;border-radius:999px;background:var(--fill);cursor:pointer;transition:background .25s ease}
.theme span{position:absolute;top:0;width:34px;height:34px;display:grid;place-items:center;font-size:15px;line-height:1;color:var(--on-fill);opacity:.75}
.theme .sun{left:0} .theme .moon{right:0}
.theme i{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.theme[aria-checked=true] i{transform:translateX(34px)}
@media (prefers-reduced-motion: reduce){ .theme,.theme i{transition:none} }
.intro{padding:36px 0 8px}
.intro h1{font-family:var(--serif);font-weight:900;font-size:clamp(30px,5vw,44px);line-height:1.3;margin:0 0 8px}
.intro p{margin:0;color:var(--muted);max-width:40em}
.updated{font-size:13px;color:var(--muted);margin-top:6px}
.stale{font-size:12px;line-height:1;padding:3px 6px;border-radius:3px;border:1px solid var(--seal);color:var(--seal);margin-left:6px}

/* 分類按鈕：圓角滑軌，選取的底色會左右滑動；選項太多放不下時可以橫向捲動 */
.seg{position:relative;display:inline-flex;max-width:100%;padding:4px;border-radius:999px;background:var(--tint);border:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg::-webkit-scrollbar{display:none}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--fill);box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .28s cubic-bezier(.4,0,.2,1),width .28s cubic-bezier(.4,0,.2,1)}
.seg.still .thumb{transition:none}
.seg button{position:relative;flex:none;font:inherit;font-size:15px;font-weight:500;line-height:1.4;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:6px 16px;cursor:pointer;white-space:nowrap;transition:color .2s}
.seg button[aria-pressed=true]{color:var(--on-fill);font-weight:700}
.pickrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 0}
.pickrow select{font:inherit;font-size:15px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:8px 16px;max-width:100%}
.modes button{padding:7px 26px}
@media (prefers-reduced-motion: reduce){ .seg .thumb,.seg button{transition:none} }

/* 摘要 */
.sums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:22px}
.sum{background:var(--sheet);border:1px solid var(--rule);border-top:4px solid var(--fill);padding:14px 16px}
.sum .k{font-size:14px;color:var(--muted)}
.sum .v{font-family:var(--serif);font-weight:900;font-size:30px;line-height:1.25;color:var(--accent)}
.sum .v small{font-family:var(--sans);font-weight:500;font-size:14px;color:var(--muted);margin-left:4px}
.sum .n{font-size:13px;color:var(--muted)}

section.block{padding:36px 0 0}
section.block h2{font-family:var(--serif);font-weight:900;font-size:24px;margin:0 0 4px}
section.block p.lead{margin:0 0 16px;color:var(--muted);font-size:15px;max-width:44em}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center}
.tools select[hidden]{display:none}
.pickrow select[hidden]{display:none}
.tools select,.tools input[type=search]{font:inherit;font-size:15px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:8px 16px;max-width:100%}
.tools input[type=search]{flex:1 1 200px;min-width:0}
.tools input::placeholder{color:var(--muted)}
.tools label{display:flex;align-items:center;gap:6px;font-size:15px;cursor:pointer}
.tools label input{accent-color:var(--accent);width:16px;height:16px}

.rank{background:var(--sheet);border:1px solid var(--rule);overflow-x:auto}
.rank table{border-collapse:collapse;width:100%}
.rank th,.rank td{padding:10px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
.rank tr:last-child td{border-bottom:0}
.rank th{font-weight:400;color:var(--muted);font-size:13px;background:var(--tint)}
.rank th.l,.rank td.l{text-align:left}
.rank td.no{width:1%;color:var(--muted);font-family:var(--serif);font-weight:700;font-size:17px;padding-right:4px}
.rank tr.top3 td.no{color:var(--accent)}
.rank td.no small{display:block;font-family:var(--sans);font-weight:500;font-size:12px;line-height:1.2;color:var(--muted);white-space:nowrap}
.rank td.no small.up{color:var(--up)} .rank td.no small.down{color:var(--down)}
.rank td.no small.new{color:var(--accent)}
.rank td.who{white-space:normal;min-width:8em}
.who b{font-weight:700}
.who small{display:block;font-size:13px;color:var(--muted)}
.rank th .us{display:none}
.tag{font-size:12px;line-height:1;padding:3px 6px;border-radius:3px;background:var(--soft);color:var(--accent);margin-left:6px;font-weight:400;white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)}
.val{position:relative;min-width:150px}
.val i{position:absolute;right:8px;top:8px;bottom:8px;background:var(--soft);border-radius:2px}
.val span{position:relative;font-weight:700}
.val small{display:none;position:relative;font-size:12px;line-height:1.2;color:var(--muted)}
.rt{color:var(--muted)} .rt.hot,.val small.hot{color:var(--accent);font-weight:700}
/* 產業熱力圖 */
.heat{position:relative;width:100%;background:var(--sheet);border:1px solid var(--rule);overflow:hidden}
.heat .ind{position:absolute;overflow:hidden;box-shadow:inset 0 0 0 1px var(--sheet)}
.heat .ind>b{position:absolute;left:0;right:0;top:0;height:18px;padding:0 5px;font-size:11px;font-weight:700;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.28);color:#fff;z-index:1}
.heat .st{position:absolute;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15;box-shadow:inset 0 0 0 .5px rgba(128,128,128,.45)}
.heat .st span{font-size:12px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden}
.heat .st small{font-size:10.5px;white-space:nowrap}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:26px;height:10px;display:inline-block}
.empty{padding:20px 16px;color:var(--muted)}
.fine{font-size:13px;color:var(--muted);margin:12px 0 0;max-width:46em}
footer{padding:44px 0 40px;font-size:13px;color:var(--muted)}
footer p{margin:0 0 6px;max-width:50em}
footer a{color:var(--accent)}

@media (max-width:700px){
  .rank th,.rank td{padding:9px 6px}
  .rank td.who{min-width:0}
  .rank th .u{display:none}
  .rank th .us{display:inline}
  .rank .vol,.rank .rtc{display:none}
  .val small{display:block}
  .val{min-width:66px}
  .val i{right:2px}
  .wrap{padding:0 16px}
}
.pxm,.rank th .pxh{display:none}
/* 點一列展開：走勢圖與明細 */
.rank tr.row{cursor:pointer}
.rank tr.row:hover td,.rank tr.row.open td{background:var(--tint)}
.rank tr.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rank tr.det td{padding:0;text-align:left;white-space:normal;background:var(--tint)}
.det .box{padding:6px 16px 18px}
.det .cap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;font-size:13px;color:var(--muted);margin-bottom:6px}
.det .cap b{color:var(--ink);font-weight:700}
.det svg{display:block;width:100%;height:150px;overflow:visible}
.det svg .base{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:.6;vector-effect:non-scaling-stroke}
.det svg .ln{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.det svg .ar{fill:currentColor;opacity:.13}
.det .axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.det .none{padding:22px 0;font-size:14px;color:var(--muted)}
.det .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px 16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.det .stats small{display:block;font-size:12px;color:var(--muted)}
.det .stats b{font-size:15px;font-weight:700}
@media (max-width:420px){
  .rank .px{display:none}
  .who .indx{display:none}      /* 手機太窄，產業別改在展開的明細裡看 */
  .det .box{padding:6px 10px 16px}
  .det svg{height:120px}
  .pxm{display:block;color:var(--ink);font-weight:700}
  .rank th .pxh{display:inline}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand">股市動能排行</div><button type="button" class="theme" id="theme" role="switch" aria-checked="false" aria-label="夜間版" title="切換日間版／夜間版"><span class="sun" aria-hidden="true">☀</span><span class="moon" aria-hidden="true">☾</span><i></i></button></header>

  <section class="intro">
    <h1>今天的錢流向哪裡</h1>
    <p>每天收盤後整理台股與美股的成交值排行。成交值是當天實際換手的金額，比成交量更能看出資金集中在哪些股票。</p>
    <div class="updated" id="updated">資料載入中…</div>
    <div class="pickrow">
      <div class="seg modes" role="group" aria-label="市場"><i class="thumb" aria-hidden="true"></i>
      <button type="button" data-mode="tw" aria-pressed="true">台股</button><button type="button" data-mode="us" aria-pressed="false">美股</button>
    </div>
      <div class="seg" id="viewSeg" role="group" aria-label="檢視方式"></div>
      <select id="view" aria-label="檢視方式" hidden><option value="rank" selected>排行</option><option value="heat">熱力圖</option></select>
      <select id="date" aria-label="交易日"></select>
    </div>
    <div class="sums" id="sums"></div>
  </section>

  <section class="block" id="heatBlock" hidden>
    <h2>產業熱力圖</h2>
    <p class="lead" id="heatLead"></p>
    <div class="heat" id="heat"></div>
    <div class="legend" id="heatLegend"></div>
  </section>

  <section class="block" id="rankBlock">
    <h2 id="listTitle">成交值排行</h2>
    <p class="lead" id="lead"></p>
    <div class="tools">
      <div class="seg" id="marketSeg" role="group" aria-label="市場別"></div>
      <select id="market" aria-label="市場別" hidden><option value="all">上市＋上櫃</option><option value="上市">只看上市</option><option value="上櫃">只看上櫃</option></select>
      <div class="seg" id="countSeg" role="group" aria-label="顯示名次"></div>
      <select id="count" aria-label="顯示名次" hidden><option value="20">前 20 名</option><option value="50" selected>前 50 名</option><option value="100">前 100 名</option></select>
      <div class="seg" id="sortSeg" role="group" aria-label="排序方式"></div>
      <select id="sort" aria-label="排序方式" hidden><option value="value" selected>依成交值</option><option value="ratio">依放大倍數</option></select>
      <label id="etfWrap"><input type="checkbox" id="etf" checked> 含 ETF</label>
      <input type="search" id="q" placeholder="搜尋代號或名稱" aria-label="搜尋代號或名稱">
    </div>
    <div class="rank" id="rank"></div>
    <p class="fine" id="note"></p>
  </section>

  <footer>
    <p id="src"></p>
    <p>漲跌顏色採台灣慣例：紅色上漲、綠色下跌。美股成交值以「收盤價 × 成交量」估算，與實際成交金額會有些微差距，且不含 ETF。</p>
    <p>本站僅整理公開資訊供參考，不構成任何投資建議。</p>
  </footer>
</div>

<script>
/* ===== 資料：讀取每日抓取的 data/tw.json 與 data/us.json ===== */
var MODES = {
  tw:{title:'台股成交值排行', unit:'億元',   div:1e8, cur:'元',   vol:function(n){ return Math.round(n/1000).toLocaleString('zh-TW')+' 張'; }},
  us:{title:'美股成交值排行', unit:'億美元', div:1e8, cur:'美元', vol:function(n){ return (n/1e4).toLocaleString('zh-TW',{maximumFractionDigits:0})+' 萬股'; }}
};
var MODE = 'tw', DATA = {tw:null, us:null}, SAVED = {};
var LATEST = {tw:null, us:null}, DATES = {tw:[], us:[]}, PREV = {tw:null, us:null}, CACHE = {};
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function plain(t){ return String(t).toLowerCase().replace(/臺/g,'台').replace(/\s/g,''); }
function fix(n,d){ return n.toLocaleString('zh-TW',{minimumFractionDigits:d, maximumFractionDigits:d}); }
function yi(n){ var v = n/1e8; return fix(v, v>=100 ? 0 : v>=10 ? 1 : 2); }       /* 換算成「億」 */
function price(n){ return n==null ? '—' : fix(n, 2); }
function day(iso){ var d = new Date(iso); if(isNaN(d)) return ''; function p(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function tradeDay(s){ var m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s||''); if(!m) return '';
  return m[1]+'/'+m[2]+'/'+m[3]+'（'+'日一二三四五六'.charAt(new Date(+m[1],m[2]-1,+m[3]).getDay())+'）'; }
function getJSON(url){
  return fetch(url,{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
}
/* 放在 GitHub Pages 時，直接讀程式庫裡最新的檔案，抓取程式一更新網站就跟著更新 */
function dataUrl(file){
  var m = location.hostname.match(/^([^.]+)\.github\.io$/), repo = location.pathname.split('/')[1];
  return m && repo ? 'https://raw.githubusercontent.com/'+m[1]+'/'+repo+'/main/data/'+file : null;
}
function load(file){
  var remote = dataUrl(file), local = 'data/'+file;
  return remote ? getJSON(remote).catch(function(){ return getJSON(local); }) : getJSON(local);
}

/* 某一天的排行：最新一天用 tw.json／us.json，其他日期讀 data/history/ 底下的檔案 */
function snapshot(mode, date){
  var L = LATEST[mode];
  if(!date || (L && L.date===date)) return Promise.resolve(L);
  var k = mode+date;
  if(!CACHE[k]) CACHE[k] = load('history/'+mode+'/'+date+'.json').catch(function(){ return null; });
  return CACHE[k];
}
/* 切換日期：同時載入前一個交易日，用來比較名次 */
function pickDate(date){
  var mode = MODE, list = DATES[mode], i = list.indexOf(date);
  return Promise.all([snapshot(mode, date), i>=0 && list[i+1] ? snapshot(mode, list[i+1]) : null]).then(function(res){
    if(mode!==MODE || $('date').value!==date) return;
    DATA[mode] = res[0] || LATEST[mode]; PREV[mode] = res[1];
    render();
  });
}

/* ===== 依目前的篩選條件排出名次 ===== */
function order(d, n){
  var rows = (d && d.rows) || [], mk = $('market').value, etf = $('etf').checked;
  if(MODE==='tw') rows = rows.filter(function(r){ return (mk==='all' || r.market===mk) && (etf || !r.etf); });
  rows = rows.slice().sort(function(a,b){ return b.value-a.value; });
  return n ? rows.slice(0,n) : rows;
}
function ranked(){ return order(DATA[MODE], parseInt($('count').value,10)); }
/* 前一個交易日在相同篩選條件下的名次：{代號: 名次} */
function prevRanks(){
  var p = PREV[MODE], map = null;
  if(p && p.rows && p.rows.length){ map = {}; order(p).forEach(function(r,i){ map[r.code] = i+1; }); }
  return map;
}
function moveCell(r, map){
  if(!map) return '';
  var was = map[r.code];
  if(!was) return '<small class="new">新進榜</small>';
  var d = was - r._no;
  return d>0 ? '<small class="up">▲ '+d+'</small>' : d<0 ? '<small class="down">▼ '+(-d)+'</small>' : '<small>—</small>';
}
/* 與前一個交易日同樣名次範圍的合計相比 */
function vsPrev(sum, n){
  if(!PREV[MODE]) return '';
  var before = order(PREV[MODE], n).reduce(function(s,r){ return s+r.value; },0);
  if(!before) return '';
  var p = (sum/before-1)*100;
  return (p>=0?'比前一交易日多 ':'比前一交易日少 ')+fix(Math.abs(p),1)+'%';
}
function pctCell(r){
  var pm = '<span class="pxm">'+price(r.close)+'</span>';      /* 手機窄螢幕沒有收盤欄，收盤價改顯示在漲跌幅上方 */
  if(r.pct==null) return '<td>'+pm+'—</td>';
  var c = r.pct>0 ? 'up' : r.pct<0 ? 'down' : '';
  return '<td class="'+c+'">'+pm+(r.pct>0?'▲ ':r.pct<0?'▼ ':'')+fix(Math.abs(r.pct),2)+'%</td>';
}
function renderSums(d, rows){
  var M = MODES[MODE];
  if(!rows.length){ $('sums').innerHTML=''; return; }
  var sum = rows.reduce(function(s,r){ return s+r.value; },0), top10 = rows.slice(0,10).reduce(function(s,r){ return s+r.value; },0);
  var up = rows.filter(function(r){ return r.pct>0; }).length, down = rows.filter(function(r){ return r.pct<0; }).length;
  var whole = MODE==='tw' && $('market').value!=='all' ? ((d.markets||{})[$('market').value]||{}).total_value : d.total_value;
  var all = whole && (MODE!=='tw' || $('etf').checked);       /* 全市場合計含 ETF，排除 ETF 時不拿來算占比 */
  var cards = [
    ['成交值第一名', esc(rows[0].name), esc(rows[0].code)+'，'+yi(rows[0].value)+' '+M.unit, true],

/* squarify：把一串數值排成盡量接近正方形的矩形，面積與數值成正比。items 需由大到小 */
function squarify(items, x, y, w, h){
  var total = items.reduce(function(s,i){ return s+i.v; },0), out = [];
  if(!(total>0) || w<=0 || h<=0) return out;
  var k = w*h/total, rest = items.map(function(i){ return {item:i, a:i.v*k}; });
  while(rest.length){
    var side = Math.min(w,h), row = [], sum = 0, best = Infinity, mx = 0, mn = Infinity;
    while(rest.length){
      var a = rest[0].a, s2 = sum+a, hi = Math.max(mx,a), lo = Math.min(mn,a);
      var worst = Math.max(side*side*hi/(s2*s2), s2*s2/(side*side*lo));
      if(row.length && worst>best) break;
      row.push(rest.shift()); sum = s2; best = worst; mx = hi; mn = lo;
    }
    var thick = sum/side, pos;
    if(w>=h){ pos = y; row.forEach(function(r){ var len = r.a/thick; out.push({item:r.item, x:x, y:pos, w:thick, h:len}); pos += len; }); x += thick; w -= thick; }
    else    { pos = x; row.forEach(function(r){ var len = r.a/thick; out.push({item:r.item, x:pos, y:y, w:len, h:thick}); pos += len; }); y += thick; h -= thick; }
  }
  return out;
}
/* 漲跌幅 → 顏色：紅漲綠跌，5% 以上最深；回傳 [底色, 字色] */
function heatColor(pct){
  var dark = isDark(), base = dark ? [42,42,42] : [232,238,243];
  if(pct==null || !pct) return ['rgb('+base.join(',')+')', dark ? '#E6E6E6' : '#16242F'];
  var to = pct>0 ? (dark ? [226,74,62] : [214,52,52]) : (dark ? [34,160,107] : [18,138,90]);
  var t = .18 + .82*Math.min(Math.abs(pct)/5, 1);
  var c = base.map(function(b,i){ return Math.round(b+(to[i]-b)*t); });
  return ['rgb('+c.join(',')+')', t>.42 ? '#fff' : (dark ? '#E6E6E6' : '#16242F')];
}

/* 把選取的底色移到目前選中的按鈕底下；still 為 true 時不播動畫（剛載入或視窗大小改變時） */
function syncSeg(seg, still){
  var on = seg.querySelector('button[aria-pressed=true]'), thumb = seg.querySelector('.thumb');
  if(!on || !thumb || !on.offsetWidth) return;
  if(still) seg.classList.add('still');
  thumb.style.width = on.offsetWidth+'px';
  thumb.style.transform = 'translateX('+on.offsetLeft+'px)';
  if(still){ void thumb.offsetWidth; seg.classList.remove('still'); }
  /* 選項被捲到看不見時，自動捲回來 */
  if(on.offsetLeft < seg.scrollLeft || on.offsetLeft+on.offsetWidth > seg.scrollLeft+seg.clientWidth)
    seg.scrollTo({left:on.offsetLeft-24, behavior: still ? 'auto' : 'smooth'});

    syncSeg(seg);
    sel.value = b.dataset.v;
    sel.dispatchEvent(new Event('input', {bubbles:true}));
  });
}
window.addEventListener('resize', function(){ syncSegs(true); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ syncSegs(true); });

/* 記住上次看的市場與篩選（只存在這台裝置） */
try{ SAVED = JSON.parse(localStorage.getItem('stock-rank')||'{}'); }catch(e){ SAVED = {}; }
function remember(){
  try{ localStorage.setItem('stock-rank', JSON.stringify({mode:MODE, view:$('view').value, market:$('market').value, count:$('count').value, etf:$('etf').checked})); }catch(e){}
}
var BOOTED = false;
function setMode(m){
  MODE = MODES[m] ? m : 'tw';
  $('marketSeg').hidden = $('etfWrap').hidden = MODE!=='tw';
  $('marketSeg').style.display = $('etfWrap').style.display = MODE==='tw' ? '' : 'none';
  document.querySelectorAll('.modes button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.mode===MODE ? 'true' : 'false'); });
  var list = DATES[MODE];
  $('date').innerHTML = list.map(function(x,i){ return '<option value="'+x+'">'+tradeDay(x)+(i===0?'・最新':'')+'</option>'; }).join('');
  $('date').hidden = list.length<1; $('date').style.display = list.length<1 ? 'none' : '';
  DATA[MODE] = LATEST[MODE]; PREV[MODE] = null;
  render();
  syncSeg(document.querySelector('.modes'), !BOOTED); syncSeg($('marketSeg'), true); syncSeg($('countSeg'), true); syncSeg($('sortSeg'), true); BOOTED = true;
  if(list.length) pickDate(list[0]);
}
$('date').addEventListener('input',function(){ pickDate($('date').value); });
['market','count','etf','q','sort','view'].forEach(function(id){ $(id).addEventListener('input',function(){ render(); remember(); }); });
document.querySelectorAll('.modes button').forEach(function(b){
  b.addEventListener('click',function(){ setMode(b.dataset.mode); remember(); });
});
if(SAVED.market) $('market').value = SAVED.market;
if(SAVED.count) $('count').value = SAVED.count;
if(SAVED.etf===false) $('etf').checked = false;
if(SAVED.view==='heat') $('view').value = 'heat';
segFrom('market'); segFrom('count'); segFrom('sort'); segFrom('view');

function nul(){ return null; }
Promise.all([load('tw.json').catch(nul), load('us.json').catch(nul), load('tw_dates.json').catch(nul), load('us_dates.json').catch(nul)]).then(function(res){
  ['tw','us'].forEach(function(k,i){
    LATEST[k] = DATA[k] = res[i];
    var list = ((res[i+2]||{}).dates||[]).slice().sort().reverse(), cur = res[i] && res[i].rows && res[i].rows.length ? res[i].date : null;
    if(cur && list.indexOf(cur)<0) list.unshift(cur);      /* 日期清單還沒跟上時，至少有最新一天 */
    DATES[k] = list;
  });
  if(!res[0] && !res[1]) $('updated').textContent = '資料載入失敗，請稍後重新整理。';
  setMode(SAVED.mode||'tw');
});
</script>
</body>
</html>
