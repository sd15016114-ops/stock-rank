name: 盤中資金板塊

on:
  schedule:
    # GitHub 的排程常常延遲很久、偶爾整個跳過，所以排好幾個時間：第一個成功啟動的會一路跑到收盤，
    # 其他的會排隊，等輪到時已經收盤，或發現今天已經有人在跑，就直接結束
    - cron: "45 23 * * 0-4"   # 台灣時間 07:45（週一到週五）
    - cron: "15 0 * * 1-5"    # 08:15
    - cron: "45 0 * * 1-5"    # 08:45
    - cron: "15 1 * * 1-5"    # 09:15
    - cron: "45 1 * * 1-5"    # 09:45
  workflow_dispatch:
    inputs:
      task:
        description: run＝盤中一路跑到收盤；probe＝只登入抓幾檔試試
        type: choice
        default: probe
        options: [probe, run]

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355      # GitHub 單次上限 6 小時；最早 07:45 啟動到 13:36 結束約 5 小時 50 分
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝永豐 Shioaji
        run: pip install shioaji

      - name: 盤中資金
        env:
          TZ: Asia/Taipei
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scraper/live_tw.py ${{ github.event.inputs.task || 'run' }}

      - name: 收盤後保存最後一份
        if: always() && (github.event.inputs.task || 'run') == 'run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/live_tw.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -m "盤中資金 $(TZ=Asia/Taipei date +%F)"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep 10; done
